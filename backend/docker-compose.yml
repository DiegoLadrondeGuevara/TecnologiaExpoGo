version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: techstore-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: techstore
      POSTGRES_PASSWORD: techstore_secret
      POSTGRES_DB: techstore
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
